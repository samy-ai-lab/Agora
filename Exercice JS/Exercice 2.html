<!DOCTYPE html>
<html>
<body>
  <script>
    function carre(n) {
      return n * n;
    }

    function bonjour(nom) {
      return `Bonjour ${nom} !`;
    }

    console.log(carre(4));
    console.log(bonjour("Samy"));

    // Bonus : fonctions fléchées
    const carre2 = (n) => n * n;
    const bonjour2 = (nom) => `Bonjour ${nom} !`;

    console.log(carre2(4));
    console.log(bonjour2("Samy"));
  </script>
</body>
</html>
