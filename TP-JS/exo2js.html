<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>À toi de jouer #2 : fonctions</title>
</head>
<body>
  <h1>À toi de jouer #2 : fonctions</h1>
  <p>voila</p>

  <script>
    function carre(n) {
      return n * n;
    }

    function bonjour(nom) {
      return `Bonjour ${nom} !`;
    }

    console.log(carre(4));
    console.log(bonjour("Teo"));

    const carreFleche = (n) => n * n;
    const bonjourFleche = (nom) => `Bonjour ${nom} !`;

    console.log(carreFleche(5));
    console.log(bonjourFleche("Alice"));
  </script>
</body>
</html>
