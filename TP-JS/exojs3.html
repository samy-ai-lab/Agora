<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>À toi de jouer #3 : le DOM</title>
</head>
<body>
  <h1>Titre</h1>

  <ul>
    <li>HTML</li>
    <li>CSS</li>
  </ul>

  <p>Premier para</p>
  <p>Deuxième para</p>
  <p>Troisième para</p>

  <script>
    const titre = document.querySelector("h1");
    titre.textContent = "À toi de jouer #3 : le DOM";

    const liste = document.querySelector("ul");
    const nouveauLi = document.createElement("li");
    nouveauLi.textContent = "JavaScript";
    liste.appendChild(nouveauLi);

    const paragraphes = document.querySelectorAll("p");
    paragraphes.forEach((p) => {
      p.style.color = "red";
    });
  </script>
</body>
</html>
