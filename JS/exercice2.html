<!DOCTYPE html>
<html>
<body>
<script>
  function carre(n) {
    return n * n;
  }

  function bonjour(nom) {
    return `Bonjour ${nom} !`;
  }

  console.log(carre(4));
  console.log(bonjour("Chris"));

  const carreFleche = (n) => n * n;
  const bonjourFleche = (nom) => `Bonjour ${nom} !`;

  console.log(carreFleche(4));
  console.log(bonjourFleche("Chris"));
</script>
</body>
</html>
