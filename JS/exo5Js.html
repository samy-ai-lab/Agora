<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS - À toi de jouer #5</title>
</head>
<body>
    <h1>Inscription</h1>

    <form id="mon-formulaire">
        <div>
            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" required>
        </div>

        <div>
            <label for="email">E-mail :</label>
            <input type="email" id="email" name="email" required>
        </div>

        <button type="submit">Envoyer</button>
    </form>

    <p id="message-erreur" style="color: red;" aria-live="polite"></p>
    <p id="message-ok" style="color: green;" aria-live="polite"></p>

    <script>
        const formulaire = document.querySelector("#mon-formulaire");
        const champNom = document.querySelector("#nom");
        const champEmail = document.querySelector("#email");
        const messageErreur = document.querySelector("#message-erreur");
        const messageOk = document.querySelector("#message-ok");

        formulaire.addEventListener("submit", (event) => {
            const nom = champNom.value.trim();

            // Réinitialise les messages avant de vérifier
            messageErreur.textContent = "";
            messageOk.textContent = "";

            if (nom.length < 3) {
                event.preventDefault(); // Bloque l'envoi du formulaire
                messageErreur.textContent = "Erreur : le nom doit contenir au moins 3 caractères.";
                champNom.focus();
                return;
            }

            // Ici, si tu n'as pas de serveur/action, on bloque aussi le rechargement pour tester l'affichage
            event.preventDefault();
            messageOk.textContent = `Formulaire valide pour ${nom} (${champEmail.value}) !`;
        });
    </script>
</body>
</html>
