<!DOCTYPE html>
<html lang="fr">
</html>
<head>
  <meta charset="UTF-8">
</head>
<body>
 <script>
  function carre(n) {
    return n * n;
  }

  function bonjour(nom) {
    return `Bonjour ${nom} !`;
  }

  console.log(carre(5));
  console.log(bonjour("Alice"));

  const carreFleche = (n) => n * n;
  const bonjourFleche = (nom) => `Bonjour ${nom} !`;

  console.log(carreFleche(5));
  console.log(bonjourFleche("Alice"));
  </script>
</body>
</html>
