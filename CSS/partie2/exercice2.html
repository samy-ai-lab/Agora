<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercice 2</title>
  <style>
    /* Exercice 2 */
    body {
      margin: 0;
      font-family: sans-serif;
      display: grid;
      grid-template-columns: 200px 1fr;
      grid-template-areas:
        "entete entete"
        "menu contenu"
        "pied pied";
    }

    header {
      grid-area: entete;
      background: #2B3A67;
      color: white;
      padding: 15px;
    }

    aside {
      grid-area: menu;
      background: #e2e8f0;
      padding: 15px;
    }

    main {
      grid-area: contenu;
      padding: 15px;
    }

    footer {
      grid-area: pied;
      background: #2B3A67;
      color: white;
      padding: 15px;
    }

    .cartes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    article {
      border: 1px solid #cbd5e1;
      padding: 10px;
    }

    .une {
      grid-column: span 2;
      background: #fef3c7;
    }
  </style>
</head>
<body>
  <header>
    <h1>Club Lecture</h1>
  </header>

  <aside>
    <p>Accueil</p>
    <p>Livres</p>
    <p>Partenaires</p>
    <p>Contact</p>
  </aside>

  <main>
    <div class="cartes">
      <article class="une">
        <h3>À la une</h3>
        <p>Le livre du mois : Le Petit Prince.</p>
      </article>
      <article>
        <h3>L'Étranger</h3>
        <p>Un roman d'Albert Camus.</p>
      </article>
      <article>
        <h3>1984</h3>
        <p>Un roman de George Orwell.</p>
      </article>
      <article>
        <h3>Dune</h3>
        <p>Un classique de la science-fiction.</p>
      </article>
      <article>
        <h3>Emma</h3>
        <p>Un roman de Jane Austen.</p>
      </article>
      <article>
        <h3>Candide</h3>
        <p>Un conte de Voltaire.</p>
      </article>
    </div>
  </main>

  <footer>
    <p>© 2026 Club Lecture</p>
  </footer>
</body>
</html>
