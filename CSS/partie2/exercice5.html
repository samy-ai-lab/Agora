<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercice 5 - Page 1</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .galerie {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .galerie img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
    }

    .deco {
      width: 100%;
    }

    .pagination {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .pagination a {
      padding: 8px 12px;
      border: 1px solid #2B3A67;
      border-radius: 6px;
      color: #2B3A67;
      text-decoration: none;
    }

    .pagination a[aria-current="page"] {
      background: #2B3A67;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Galerie du club</h1>
  <img src="img/deco.png" alt="" class="deco">

  <div class="galerie">
    <img src="img/le-petit-prince.png" alt="Couverture du livre Le Petit Prince">
    <img src="img/l-etranger.png" alt="Couverture du livre L'Étranger">
    <img src="img/1984.png" alt="Couverture du livre 1984">
    <img src="img/dune.png" alt="Couverture du livre Dune">
  </div>

  <nav aria-label="Pagination" class="pagination">
    <a href="exercice5.html" aria-current="page">1</a>
    <a href="exercice5-page2.html">2</a>
    <a href="exercice5-page2.html" aria-label="Page suivante">Page suivante</a>
  </nav>
</body>
</html>
