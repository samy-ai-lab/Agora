<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercice 4</title>
  <style>
    /* Exercice 4 */
    body {
      font-family: sans-serif;
      background: #f1f5f9;
      padding: 40px;
    }

    .carte {
      background: white;
      width: 300px;
      padding: 20px;
      border-radius: 10px;
      animation: apparition 0.8s;
    }

    @keyframes apparition {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      background: linear-gradient(to right, #2B3A67, #22c55e);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover,
    button:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
    }

    button:focus-visible {
      outline: 3px solid #1a5fb4;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="carte">
    <h2>Rejoins le club</h2>
    <p>Un livre par mois, une discussion ensemble.</p>
    <button>S'inscrire</button>
  </div>
</body>
</html>
