<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercice 1</title>
  <style>
    /* Exercice 1 */
    body {
      margin: 0;
      font-family: sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: #2B3A67;
    }

    .logo {
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 20px;
      width: 60%;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    .contact {
      margin-left: auto;
    }
  </style>
</head>
<body>
  <header>
    <span class="logo">Club Lecture</span>
    <nav>
      <a href="#">Accueil</a>
      <a href="#">Livres</a>
      <a href="#">Partenaires</a>
      <a href="#" class="contact">Contact</a>
    </nav>
  </header>
</body>
</html>
