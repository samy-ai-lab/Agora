<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercice 2</title>
  <style>
    /* Exercice 2 */
    body {
      display: grid;
      grid-template-areas:
        "entete entete"
        "menu contenu"
        "pied pied";
    }

    header {
      grid-area: entete;
    }

    aside {
      grid-area: menu;
    }

    main {
      grid-area: contenu;
    }

    footer {
      grid-area: pied;
    }

    .galerie {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    .une {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <header>En-tête</header>

  <aside>Menu</aside>

  <main>
    <div class="galerie">
      <article class="une">
        <h3>À la une</h3>
        <p>Texte</p>
      </article>
      <article>
        <h3>Article 2</h3>
        <p>Texte</p>
      </article>
      <article>
        <h3>Article 3</h3>
        <p>Texte</p>
      </article>
      <article>
        <h3>Article 4</h3>
        <p>Texte</p>
      </article>
      <article>
        <h3>Article 5</h3>
        <p>Texte</p>
      </article>
      <article>
        <h3>Article 6</h3>
        <p>Texte</p>
      </article>
    </div>
  </main>

  <footer>Pied de page</footer>
</body>
</html>
